<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login Voting</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            width: 320px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        h2 { color: #b31217; }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background: #f1f1f1;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: #b31217;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
        }

        .btn:hover { background: #8e0e00; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Error Popup */
        .popup-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 99;
        }
        .popup-overlay.show { display: flex; }
        .popup-box {
            background: #fff;
            border-radius: 12px;
            padding: 24px 20px;
            max-width: 280px;
            width: 90%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .popup-box h3 { color: #b31217; margin-bottom: 8px; }
        .popup-box p  { color: #555; font-size: 14px; margin-bottom: 16px; }
        .popup-box button {
            background: #b31217;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 24px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Login Voting</h2>

    <form onsubmit="loginUser(event)">
        <input type="text"     name="username" placeholder="Masukkan NIPD"     required />
        <input type="password" name="password" placeholder="Masukkan Password" required />
        <button type="submit" class="btn btn-login">Masuk</button>
    </form>
</div>

<!-- Error Popup -->
<div class="popup-overlay" id="errorPopup">
    <div class="popup-box">
        <h3>Gagal Masuk</h3>
        <p>Pesan error.</p>
        <button onclick="closePopup('errorPopup')">Tutup</button>
    </div>
</div>

<script src="Api.js"></script>
</body>
</html>
