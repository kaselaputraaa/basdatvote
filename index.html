<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pilih Jenis Voting</title>
<style>
  body {
    margin:0; font-family:Arial,sans-serif; background:white;
    height:100vh; display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    visibility:hidden;
  }
  .logo-utama {
    width:100px; height:100px; border-radius:50%; object-fit:cover;
    margin-bottom:10px; border:3px solid rgb(0,17,255);
  }
  h1 { color:#b31217; margin-bottom:30px; }
  .container { display:flex; gap:40px; }
  .box {
    width:260px; height:200px; background:white; border-radius:20px;
    display:flex; flex-direction:column; justify-content:center;
    align-items:center; text-decoration:none; color:#b31217;
    font-weight:bold; box-shadow:0 10px 25px rgba(0,0,0,.2); transition:.3s;
    cursor:pointer; border:none;
  }
  .box:hover { transform:scale(1.08); background:#ffe5e5; }
  .logo-box  { width:80px; height:80px; object-fit:cover; margin-bottom:10px; }
  .mpk-text  { color:#2e7d32; }
</style>
</head>
<body>

<img src="gambar/2-removebg-preview.png" class="logo-utama" onerror="this.style.display='none'">
<h1>Pilih Jenis Voting</h1>

<div class="container">
  <div class="box" onclick="window.location.href='osis.html'">
    <img src="gambar/4-removebg-preview.png" class="logo-box" onerror="this.style.display='none'">
    <span>OSIS</span>
  </div>
  <div class="box" onclick="window.location.href='mpk.html'">
    <img src="gambar/3-removebg-preview.png" class="logo-box" onerror="this.style.display='none'">
    <span class="mpk-text">MPK</span>
  </div>
</div>

<script src="Api.js"></script>
<script>
(async () => {
  const ok = await Session.require();
  if (ok) document.body.style.visibility = 'visible';
})();
</script>
</body>
</html>
